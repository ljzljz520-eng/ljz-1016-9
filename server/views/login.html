<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 发布运维台</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">🚀</div>
    <h1 class="login-title">发布运维台</h1>
    <p class="login-subtitle">Release Ops Console</p>
    <form id="login-form" novalidate>
      <label class="field">
        <span>用户名</span>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" required />
      </label>
      <label class="field">
        <span>密码</span>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
      </label>
      <div id="login-error" class="form-error" hidden></div>
      <button id="login-btn" type="submit" class="btn-primary">登 录</button>
    </form>
  </div>
  <script src="/assets/login.js"></script>
</body>
</html>
