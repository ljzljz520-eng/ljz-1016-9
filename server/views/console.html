<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发布运维台</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body class="console-page">
  <aside class="sidebar">
    <div class="sidebar-brand">🚀 <span class="brand-text">发布运维台</span></div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-module="releases">
        <span class="nav-icon">📦</span><span class="nav-label">发布记录</span>
      </button>
      <button class="nav-item" data-module="env-config">
        <span class="nav-icon">⚙️</span><span class="nav-label">环境配置</span>
      </button>
      <button class="nav-item" data-module="access-logs">
        <span class="nav-icon">📜</span><span class="nav-label">访问日志</span>
      </button>
    </nav>
    <div class="sidebar-footer">v1.0.0</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div id="page-title" class="page-title">发布记录</div>
      <div class="topbar-right">
        <span class="user-badge">👤 <span id="current-user">…</span></span>
        <button id="logout-btn" class="btn-ghost">退出登录</button>
      </div>
    </header>

    <main class="content">
      <section class="module-panel" data-panel="releases">
        <div class="placeholder-card">
          <div class="placeholder-icon">📦</div>
          <h2>发布记录</h2>
          <p>模块建设中，后续将在此展示各环境的发布历史、状态与回滚操作。</p>
          <div class="api-status" data-api-status="/api/releases">接口检测中…</div>
        </div>
      </section>

      <section class="module-panel" data-panel="env-config" hidden>
        <div class="placeholder-card">
          <div class="placeholder-icon">⚙️</div>
          <h2>环境配置</h2>
          <p>模块建设中，后续将在此管理开发 / 测试 / 生产等环境的配置项。</p>
          <div class="api-status" data-api-status="/api/env-config">接口检测中…</div>
        </div>
      </section>

      <section class="module-panel" data-panel="access-logs" hidden>
        <div class="placeholder-card">
          <div class="placeholder-icon">📜</div>
          <h2>访问日志</h2>
          <p>模块建设中，后续将在此查询站点访问日志与操作审计记录。</p>
          <div class="api-status" data-api-status="/api/access-logs">接口检测中…</div>
        </div>
      </section>
    </main>
  </div>
  <script src="/assets/console.js"></script>
</body>
</html>
